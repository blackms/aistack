# docker-compose.yml
# ---------------------------------------------------------------------------
# Default on-prem stack for aistack.
#
# Profiles:
#   (default) -> aistack only, SQLite local data
#   postgres  -> + Postgres backend (for multi-instance deployments)
#   otel      -> + OpenTelemetry collector (export traces/metrics/logs)
#
# Usage:
#   docker compose up -d                       # aistack only
#   docker compose --profile postgres up -d    # + Postgres
#   docker compose --profile otel up -d        # + OTel collector
#   docker compose --profile postgres --profile otel up -d
# ---------------------------------------------------------------------------

services:
  aistack:
    image: ghcr.io/blackms/aistack:latest
    # Uncomment to build locally instead of pulling:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: aistack
    restart: unless-stopped
    command: ["web", "start", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Secrets: REQUIRED. Provide via .env file, shell env, or external secret
      # manager. The `:?` syntax fails `docker compose up` with a clear error
      # if the variable is unset, so we never ship a known-default credential.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>= 32 random chars). Example: openssl rand -hex 32}
      REFRESH_SECRET: ${REFRESH_SECRET:?REFRESH_SECRET must be set (>= 32 random chars). Example: openssl rand -hex 32}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Postgres (active under `postgres` profile)
      DATABASE_URL: ${DATABASE_URL:-}
      # OTel (active under `otel` profile)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - aistack-data:/data
      - ./agentstack.config.json:/etc/aistack/agentstack.config.json:ro
    healthcheck:
      # HTTP liveness against the web daemon (AIG-636). node:20-slim has no
      # curl/wget, so use node's built-in http client.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/api/v1/system/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      otel-collector:
        condition: service_started
        required: false

  postgres:
    # postgres:16-alpine multi-arch index digest. Refresh periodically:
    # `docker buildx imagetools inspect postgres:16-alpine`.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: aistack-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aistack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aistack}
      POSTGRES_DB: ${POSTGRES_DB:-aistack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aistack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: aistack-otel
    profiles: ["otel"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  aistack-data:
    driver: local
  postgres-data:
    driver: local
